# Render one-click deploy — DanskPath Full Stack — FREE TIER COMPATIBLE v3
# Fixes vite: not found — vite is in devDependencies, NODE_ENV=production skips devDeps
# Solution: npm ci --include=dev && npm run build

services:
  - type: web
    name: danskpath
    env: node
    plan: free
    region: frankfurt # close to Copenhagen, GDPR EU
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 10000
