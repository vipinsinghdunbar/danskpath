# Render one-click deploy — DanskPath Full Stack — FREE TIER COMPATIBLE v2
# Blueprint ID exs-dat3gtm0tbcc739o29d0 — Sync 41d2a24 fixed disk/headers
# This v2 adds NODE_VERSION and removes healthCheckPath to prevent false failed deploys

services:
  - type: web
    name: danskpath
    env: node
    plan: free
    region: frankfurt # close to Copenhagen, GDPR EU — if fails try oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    autoDeploy: true # GitHub push → App auto-updates
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 10000
