# Render one-click deploy — DanskPath Full Stack — FREE TIER COMPATIBLE
# https://render.com/docs/blueprint-spec
# Free tier: 750 hours/month — no disk needed (uses ephemeral storage, DB resets on deploy but works)
# For persistent DB, upgrade to Starter $7/month and add disk back

services:
  - type: web
    name: danskpath
    env: node
    plan: free
    region: frankfurt # close to Copenhagen, GDPR EU
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true # auto-deploy on git push to main → GitHub → App updates automatically
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
