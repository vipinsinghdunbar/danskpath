name: Deploy DanskPath

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Test build
        run: |
          ls -lh dist/
          echo "Build successful — M1→PD3 full education"
      
      # Optional: Deploy to GitHub Pages (frontend only, offline mode)
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: danskpath.app # optional, remove if not using custom domain

      # Optional: Trigger Render deploy (auto if connected)
      - name: Trigger Render Deploy
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Render auto-deploys via render.yaml when GitHub connected"
          echo "Connect repo at https://dashboard.render.com/blueprint/new"
